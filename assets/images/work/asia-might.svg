<svg viewBox="0 0 765 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Abstract warehouse inventory grid">
  <defs>
    <pattern id="grid-am" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M 38 0 L 0 0 0 38" fill="none" stroke="#1B1C25" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="765" height="440" fill="#0B0C10"/>
  <rect width="765" height="440" fill="url(#grid-am)"/>
  <!-- shelf grid -->
  <g>
    <!-- row backgrounds -->
    <g transform="translate(120,96)">
      <!-- 6 columns x 4 rows of slots -->
      <!-- generated manually -->
    </g>
  </g>
  <g stroke="#2A2C38" stroke-width="1" fill="#14151C">
    <rect x="120" y="96"  width="80" height="52" rx="6"/>
    <rect x="212" y="96"  width="80" height="52" rx="6"/>
    <rect x="304" y="96"  width="80" height="52" rx="6"/>
    <rect x="396" y="96"  width="80" height="52" rx="6"/>
    <rect x="488" y="96"  width="80" height="52" rx="6"/>
    <rect x="580" y="96"  width="80" height="52" rx="6"/>

    <rect x="120" y="160" width="80" height="52" rx="6"/>
    <rect x="212" y="160" width="80" height="52" rx="6"/>
    <rect x="304" y="160" width="80" height="52" rx="6"/>
    <rect x="396" y="160" width="80" height="52" rx="6"/>
    <rect x="488" y="160" width="80" height="52" rx="6"/>
    <rect x="580" y="160" width="80" height="52" rx="6"/>

    <rect x="120" y="224" width="80" height="52" rx="6"/>
    <rect x="212" y="224" width="80" height="52" rx="6"/>
    <rect x="304" y="224" width="80" height="52" rx="6"/>
    <rect x="396" y="224" width="80" height="52" rx="6"/>
    <rect x="488" y="224" width="80" height="52" rx="6"/>
    <rect x="580" y="224" width="80" height="52" rx="6"/>

    <rect x="120" y="288" width="80" height="52" rx="6"/>
    <rect x="212" y="288" width="80" height="52" rx="6"/>
    <rect x="304" y="288" width="80" height="52" rx="6"/>
    <rect x="396" y="288" width="80" height="52" rx="6"/>
    <rect x="488" y="288" width="80" height="52" rx="6"/>
    <rect x="580" y="288" width="80" height="52" rx="6"/>
  </g>
  <!-- highlighted stock slots -->
  <g stroke="#6861F5" stroke-width="1.5" fill="rgba(104,97,245,0.14)">
    <rect x="212" y="96"  width="80" height="52" rx="6"/>
    <rect x="488" y="160" width="80" height="52" rx="6"/>
    <rect x="304" y="224" width="80" height="52" rx="6"/>
    <rect x="580" y="288" width="80" height="52" rx="6"/>
    <rect x="120" y="288" width="80" height="52" rx="6"/>
  </g>
  <!-- connecting flow line (branch routing) -->
  <path d="M 160 380 C 260 350, 340 410, 440 366 S 600 330, 660 360" fill="none" stroke="#4B3FD1" stroke-width="2" stroke-dasharray="2 8" stroke-linecap="round"/>
  <circle cx="160" cy="380" r="4" fill="#8A7DFA"/>
  <circle cx="660" cy="360" r="4" fill="#8A7DFA"/>
  <text x="120" y="70" font-family="Space Grotesk, sans-serif" font-size="15" letter-spacing="3" fill="#6B6D7C">ASIA MIGHT — INVENTORY</text>
</svg>
