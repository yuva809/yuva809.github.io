<svg viewBox="0 0 725 812" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Abstract composition representing software, AI and product engineering">
  <defs>
    <pattern id="grid-about" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1B1C25" stroke-width="1"/>
    </pattern>
    <linearGradient id="about-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8A7DFA"/>
      <stop offset="100%" stop-color="#4B3FD1"/>
    </linearGradient>
  </defs>
  <rect width="725" height="812" fill="#0B0C10"/>
  <rect width="725" height="812" fill="url(#grid-about)"/>

  <!-- layered "stack" representing product / software / AI layers -->
  <g transform="translate(362,300)">
    <rect x="-220" y="120" width="440" height="70" rx="14" fill="#14151C" stroke="#2A2C38" stroke-width="1.5"/>
    <rect x="-190" y="40" width="380" height="70" rx="14" fill="#14151C" stroke="#2A2C38" stroke-width="1.5"/>
    <rect x="-150" y="-40" width="300" height="70" rx="14" fill="#171826" stroke="url(#about-accent)" stroke-width="2"/>

    <circle cx="-160" cy="155" r="4" fill="#4B3FD1"/>
    <circle cx="160" cy="155" r="4" fill="#4B3FD1"/>
    <circle cx="-130" cy="75" r="4" fill="#8A7DFA"/>
    <circle cx="130" cy="75" r="4" fill="#8A7DFA"/>

    <text x="0" y="-2" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="15" fill="#F5F5F7" letter-spacing="1">AI &amp; AUTOMATION</text>
    <text x="0" y="80" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="15" fill="#C9C9D6" letter-spacing="1">PRODUCT ENGINEERING</text>
    <text x="0" y="160" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="15" fill="#C9C9D6" letter-spacing="1">SOFTWARE DEVELOPMENT</text>
  </g>

  <!-- floating connective nodes above -->
  <g stroke="#2A2C38" stroke-width="1" fill="none">
    <path d="M 180 220 L 260 260"/>
    <path d="M 545 220 L 465 260"/>
    <path d="M 362 130 L 362 220"/>
  </g>
  <circle cx="180" cy="220" r="5" fill="#6861F5"/>
  <circle cx="545" cy="220" r="5" fill="#6861F5"/>
  <circle cx="362" cy="130" r="5" fill="#8A7DFA"/>

  <text x="60" y="740" font-family="Space Grotesk, sans-serif" font-size="14" letter-spacing="3" fill="#6B6D7C">YUVANESH RAJU</text>
</svg>
