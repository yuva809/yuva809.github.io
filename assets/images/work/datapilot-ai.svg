<svg viewBox="0 0 765 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Abstract diagram of a spreadsheet transforming into an AI analytics dashboard">
  <defs>
    <pattern id="grid-dp" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M 38 0 L 0 0 0 38" fill="none" stroke="#1B1C25" stroke-width="1"/>
    </pattern>
    <linearGradient id="dp-accent" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#4B3FD1"/>
      <stop offset="100%" stop-color="#8A7DFA"/>
    </linearGradient>
  </defs>
  <rect width="765" height="440" fill="#0B0C10"/>
  <rect width="765" height="440" fill="url(#grid-dp)"/>

  <!-- spreadsheet -->
  <g transform="translate(70,90)">
    <rect x="0" y="0" width="230" height="260" rx="10" fill="#14151C" stroke="#2A2C38" stroke-width="1.5"/>
    <g stroke="#2A2C38" stroke-width="1">
      <line x1="0" y1="36" x2="230" y2="36"/>
      <line x1="0" y1="72" x2="230" y2="72"/>
      <line x1="0" y1="108" x2="230" y2="108"/>
      <line x1="0" y1="144" x2="230" y2="144"/>
      <line x1="0" y1="180" x2="230" y2="180"/>
      <line x1="0" y1="216" x2="230" y2="216"/>
      <line x1="57.5" y1="0" x2="57.5" y2="260"/>
      <line x1="115" y1="0" x2="115" y2="260"/>
      <line x1="172.5" y1="0" x2="172.5" y2="260"/>
    </g>
    <rect x="0" y="0" width="230" height="36" fill="#1B1C25"/>
    <text x="115" y="150" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="13" fill="#4A4C5C">P&amp;L.csv</text>
  </g>

  <!-- arrow -->
  <g stroke="#6861F5" stroke-width="2" fill="none">
    <path d="M 320 220 H 420" stroke-dasharray="2 8" stroke-linecap="round"/>
    <path d="M 405 208 L 420 220 L 405 232"/>
  </g>

  <!-- dashboard -->
  <g transform="translate(455,90)">
    <rect x="0" y="0" width="240" height="260" rx="10" fill="#14151C" stroke="url(#dp-accent)" stroke-width="2"/>
    <rect x="20" y="24" width="90" height="10" rx="5" fill="#3A3C4A"/>
    <!-- bars -->
    <g>
      <rect x="20" y="150" width="24" height="80" rx="4" fill="#3A3C4A"/>
      <rect x="54" y="120" width="24" height="110" rx="4" fill="#4B3FD1"/>
      <rect x="88" y="90"  width="24" height="140" rx="4" fill="#8A7DFA"/>
      <rect x="122" y="130" width="24" height="100" rx="4" fill="#4B3FD1"/>
      <rect x="156" y="70"  width="24" height="160" rx="4" fill="#8A7DFA"/>
      <rect x="190" y="110" width="24" height="120" rx="4" fill="#3A3C4A"/>
    </g>
    <!-- sparkle -->
    <g transform="translate(210,40)" fill="#8A7DFA">
      <path d="M0 -10 L2.5 -2.5 L10 0 L2.5 2.5 L0 10 L-2.5 2.5 L-10 0 L-2.5 -2.5 Z"/>
    </g>
  </g>

  <text x="70" y="60" font-family="Space Grotesk, sans-serif" font-size="15" letter-spacing="3" fill="#6B6D7C">DATAPILOT AI — INSIGHTS IN 60s</text>
</svg>
