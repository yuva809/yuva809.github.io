<svg viewBox="0 0 765 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Abstract diagram of multiple document types converging through hybrid search into ranked results">
  <defs>
    <pattern id="grid-ts" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M 38 0 L 0 0 0 38" fill="none" stroke="#1B1C25" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="765" height="440" fill="#0B0C10"/>
  <rect width="765" height="440" fill="url(#grid-ts)"/>

  <!-- source documents -->
  <g font-family="Space Grotesk, sans-serif" font-size="11" fill="#8B8D9C" text-anchor="middle">
    <g transform="translate(110,90)">
      <rect x="-30" y="-38" width="60" height="76" rx="8" fill="#14151C" stroke="#2A2C38" stroke-width="1.5"/>
      <text y="6">PDF</text>
    </g>
    <g transform="translate(110,190)">
      <rect x="-30" y="-38" width="60" height="76" rx="8" fill="#14151C" stroke="#2A2C38" stroke-width="1.5"/>
      <text y="6">DOCX</text>
    </g>
    <g transform="translate(110,290)">
      <rect x="-30" y="-38" width="60" height="76" rx="8" fill="#14151C" stroke="#2A2C38" stroke-width="1.5"/>
      <text y="6">PPTX</text>
    </g>
    <g transform="translate(110,390)">
      <rect x="-30" y="-38" width="60" height="76" rx="8" fill="#14151C" stroke="#2A2C38" stroke-width="1.5"/>
      <text y="6">JSON</text>
    </g>
  </g>

  <!-- convergence lines -->
  <g stroke="#3A3C4A" stroke-width="1.5" fill="none" stroke-dasharray="1 6" stroke-linecap="round">
    <path d="M 140 90 C 260 90, 300 220, 360 220"/>
    <path d="M 140 190 C 240 190, 300 220, 360 220"/>
    <path d="M 140 290 C 240 290, 300 220, 360 220"/>
    <path d="M 140 390 C 260 390, 300 220, 360 220"/>
  </g>

  <!-- hybrid retrieval node -->
  <g transform="translate(400,220)">
    <circle r="40" fill="#171826" stroke="#6861F5" stroke-width="2"/>
    <text text-anchor="middle" y="-4" font-family="Space Grotesk, sans-serif" font-size="11" fill="#F5F5F7">SEMANTIC</text>
    <text text-anchor="middle" y="12" font-family="Space Grotesk, sans-serif" font-size="11" fill="#C9C9D6">+ BM25</text>
  </g>

  <!-- result list -->
  <g stroke="#3A3C4A" stroke-width="1.5" fill="none" stroke-dasharray="2 8" stroke-linecap="round">
    <path d="M 440 220 H 540"/>
  </g>
  <g transform="translate(560,140)" font-family="Space Grotesk, sans-serif" font-size="12" fill="#C9C9D6">
    <rect x="0" y="0" width="150" height="36" rx="8" fill="#14151C" stroke="#4B3FD1" stroke-width="1.5"/>
    <circle cx="16" cy="18" r="4" fill="#8A7DFA"/>
    <text x="30" y="22">Result — rank 1</text>

    <rect x="0" y="52" width="150" height="36" rx="8" fill="#14151C" stroke="#2A2C38" stroke-width="1.5"/>
    <circle cx="16" cy="70" r="4" fill="#4B3FD1"/>
    <text x="30" y="74">Result — rank 2</text>

    <rect x="0" y="104" width="150" height="36" rx="8" fill="#14151C" stroke="#2A2C38" stroke-width="1.5"/>
    <circle cx="16" cy="122" r="4" fill="#4B3FD1"/>
    <text x="30" y="126">Result — rank 3</text>
  </g>

  <text x="60" y="60" font-family="Space Grotesk, sans-serif" font-size="15" letter-spacing="3" fill="#6B6D7C">TRISEARCH AI — HYBRID RAG SEARCH</text>
</svg>
